spring:
  datasource:
    url: jdbc:h2:mem:learnpath-preview;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      repositories:
        enabled: false

management:
  health:
    redis:
      enabled: false
