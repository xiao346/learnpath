services:
  mysql:
    image: mysql:8.4
    container_name: learnpath-mysql
    environment:
      MYSQL_DATABASE: learnpath
      MYSQL_USER: learnpath
      MYSQL_PASSWORD: learnpath123
      MYSQL_ROOT_PASSWORD: root123456
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - learnpath_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: learnpath-redis
    ports:
      - "6379:6379"
    volumes:
      - learnpath_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  learnpath_mysql_data:
  learnpath_redis_data:
